<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181d2a"/>
      <stop offset="70%" stop-color="#0f121a"/>
      <stop offset="100%" stop-color="#07090e"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="#252c3e" stroke-width="1.5"/>

  <!-- Concentric Euclidean Rings -->
  <!-- R1 (Kick) -->
  <circle cx="32" cy="32" r="9" fill="none" stroke="rgba(255, 71, 87, 0.35)" stroke-width="1.2"/>
  <!-- R2 (Snare) -->
  <circle cx="32" cy="32" r="14.5" fill="none" stroke="rgba(255, 165, 2, 0.35)" stroke-width="1.2"/>
  <!-- R3 (Rim) -->
  <circle cx="32" cy="32" r="19.5" fill="none" stroke="rgba(46, 213, 115, 0.35)" stroke-width="1.2"/>
  <!-- R4 (Hat) -->
  <circle cx="32" cy="32" r="24.5" fill="none" stroke="rgba(30, 144, 255, 0.35)" stroke-width="1.2"/>

  <!-- Euclidean Nodes (Glowing pulses on rings) -->
  <!-- Kick Nodes (R=9) -->
  <circle cx="32" cy="23" r="2.2" fill="#ff4757" filter="url(#glow)"/>
  <circle cx="32" cy="41" r="2.2" fill="#ff4757" filter="url(#glow)"/>
  <circle cx="23" cy="32" r="2.2" fill="#ff4757" filter="url(#glow)"/>
  <circle cx="41" cy="32" r="2.2" fill="#ff4757" filter="url(#glow)"/>

  <!-- Snare Nodes (R=14.5) -->
  <circle cx="42.2" cy="21.7" r="2.2" fill="#ffa502" filter="url(#glow)"/>
  <circle cx="21.7" cy="42.2" r="2.2" fill="#ffa502" filter="url(#glow)"/>

  <!-- Rim Nodes (R=19.5) -->
  <circle cx="51.5" cy="32" r="2.2" fill="#2ed573" filter="url(#glow)"/>
  <circle cx="18.2" cy="18.2" r="2.2" fill="#2ed573" filter="url(#glow)"/>
  <circle cx="18.2" cy="45.8" r="2.2" fill="#2ed573" filter="url(#glow)"/>

  <!-- Hat Nodes (R=24.5) -->
  <circle cx="32" cy="7.5" r="2.2" fill="#1e90ff" filter="url(#glow)"/>
  <circle cx="49.3" cy="14.7" r="2.2" fill="#1e90ff" filter="url(#glow)"/>
  <circle cx="56.5" cy="32" r="2.2" fill="#1e90ff" filter="url(#glow)"/>
  <circle cx="49.3" cy="49.3" r="2.2" fill="#1e90ff" filter="url(#glow)"/>
  <circle cx="32" cy="56.5" r="2.2" fill="#1e90ff" filter="url(#glow)"/>
  <circle cx="14.7" cy="49.3" r="2.2" fill="#1e90ff" filter="url(#glow)"/>
  <circle cx="7.5" cy="32" r="2.2" fill="#1e90ff" filter="url(#glow)"/>
  <circle cx="14.7" cy="14.7" r="2.2" fill="#1e90ff" filter="url(#glow)"/>

  <!-- Radar Sweeping Ray -->
  <line x1="32" y1="32" x2="52" y2="12" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

  <!-- Center Hub Core -->
  <circle cx="32" cy="32" r="4.5" fill="#131722" stroke="#00f0ff" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="2" fill="#00f0ff"/>
</svg>